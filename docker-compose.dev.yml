services:
  postgres:
    image: postgres:17-alpine
    container_name: bravo-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bravo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bravo_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-bravo_erp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bravo} -d ${POSTGRES_DB:-bravo_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: bravo-erp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest-dev
    container_name: bravo-erp-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-setup:
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: bravo-erp-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-bravo-erp}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing local/\"$${MINIO_BUCKET_NAME}\" &&
      mc anonymous set download local/\"$${MINIO_BUCKET_NAME}\"/public &&
      exit 0
      "
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: bravo-erp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bravo}:${POSTGRES_PASSWORD:-bravo_dev_secret}@postgres:5432/${POSTGRES_DB:-bravo_erp}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-bravo-erp}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-bravo-erp-dev-super-secret-jwt-key-change-in-prod-2026}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src:rw
      - ./backend/tests:/app/tests:rw
      - ./backend/migrations:/app/migrations:rw
      - /app/.venv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    develop:
      watch:
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: bravo-erp-worker
    restart: unless-stopped
    command: ["uv", "run", "taskiq", "worker", "src.worker:broker", "--fs-discover", "--reload", "--reload-dir", "/app/src"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bravo}:${POSTGRES_PASSWORD:-bravo_dev_secret}@postgres:5432/${POSTGRES_DB:-bravo_erp}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-bravo-erp}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-bravo-erp-dev-super-secret-jwt-key-change-in-prod-2026}
    volumes:
      - ./backend/src:/app/src:rw
      - ./backend/tests:/app/tests:rw
      - ./backend/migrations:/app/migrations:rw
      - /app/.venv
    develop:
      watch:
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: bravo-erp-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src:rw
      - ./frontend/public:/app/public:rw
      - /app/node_modules
      - /app/.next
    develop:
      watch:
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml

volumes:
  postgres_data:
  redis_data:
  minio_data:
